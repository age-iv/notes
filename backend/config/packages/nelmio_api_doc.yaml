nelmio_api_doc:
  documentation:
    info:
      title: 'Notes API'
      description: 'A clean, well-structured REST API for managing notes.'
      version: '1.0.0'
    servers:
      - url: 'http://localhost:8080' # Your local API URL
        description: 'Development Server'
    components:
      securitySchemes:
        Bearer:
          type: http
          scheme: bearer
          bearerFormat: JWT
  areas:
    path_patterns: [ ^/api ] # Only document routes under /api